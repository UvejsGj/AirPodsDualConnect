name: Idea or change
description: Suggest a feature, a doc fix or a change to the plan.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas have to fit the project's ground rules: no kernel driver, Test Mode or Secure Boot change on the laptop, no AirPods reset or firmware change, and any registry or driver change explained with its undo first. See [CONTRIBUTING.md](https://github.com/UvejsGj/AirPodsDualConnect/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Which stage does it belong to?
      options:
        - Stage 1 (measuring stock behaviour)
        - Stage 2 (proof of concept)
        - Stage 3 (the tray app)
        - Not sure
  - type: textarea
    id: changes
    attributes:
      label: What would it change on the laptop?
      description: Files, settings, registry values, drivers. Say "nothing" if nothing.
